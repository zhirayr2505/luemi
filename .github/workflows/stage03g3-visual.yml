name: LUEMI REM-00C profile behavioral and visual QA
on:
  push:
    branches:
      - main
      - 'staging/**'
      - 'remediation/**'
      - 'feat/stage03g3-*'
      - 'feat/stage03g4-*'
      - 'feat/stage03g5-*'
      - 'feat/stage03g6-*'
      - 'feat/stage03g7-*'
  pull_request:
    branches:
      - main
      - 'staging/**'
      - 'remediation/**'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Current REM-00C Android-UA browser behavioral regression (Chrome emulation)'
        type: choice
        required: true
        default: stage03g7
        options:
          - stage03g7
permissions:
  contents: read
jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run existing foundation gate
        run: npm run check
  browser-profile:
    name: Browser profile QA (REM-00C behavioral)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build runtime shared domain contracts
        run: npm run build -w @luemi/contracts
      - name: Install pinned browser revision
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the approved REM-00B pinned Chromium + dependency command.
          # An external apt/download stall must not cancel browser assertions.
          # Fallback still installs the same lockfile-pinned Chromium; never skip QA.
          if ! timeout --signal=TERM --kill-after=10s 120s npx --no-install playwright install chromium --with-deps; then
            echo "System dependency install unavailable; retry pinned Chromium with runner's preinstalled libraries."
            npx --no-install playwright install chromium
          fi
      - name: Run current REM-00C behavioral scenario
        shell: bash
        env:
          QA_SCENARIO: ${{ inputs.scenario || 'stage03g7' }}
        run: |
          set -euo pipefail
          case "$QA_SCENARIO" in
            stage03g7) script=scripts/stage03g7-android-visual-qa.mjs ;;
            *) echo "Unsupported QA scenario: $QA_SCENARIO" >&2; exit 2 ;;
          esac
          echo "Selected current behavioral scenario: $script"
          npm run dev -w @luemi/web -- --host 127.0.0.1 --port 5173 >/tmp/luemi-vite-qa.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/profile-qa.html >/dev/null; then ready=1; break; fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/luemi-vite-qa.log >&2
            echo "Profile QA server did not become ready" >&2
            exit 1
          fi
          node "$script"
          node scripts/rem-01a-browser-regression.mjs
          node scripts/rem-01b-browser-regression.mjs
          node scripts/rem-01c-browser-regression.mjs
          node scripts/rem-01d-browser-regression.mjs
          node scripts/rem-01e-browser-regression.mjs
          node scripts/rem-02a-browser-adapter.mjs
          node scripts/rem-02b-browser-regression.mjs
          node scripts/rem-02c-browser-interruption.mjs
          node scripts/rem-02d-browser-lifecycle.mjs
          node scripts/rem-03a-browser-media.mjs
          node scripts/rem-03b-browser-track.mjs
          node scripts/rem-03c-browser-pinch.mjs
          node scripts/rem-03d-browser-morph.mjs
          node scripts/rem-04a-browser-measure.mjs
          node scripts/rem-04a-browser-startup.mjs
          node scripts/rem-04b-browser-visual.mjs
          node scripts/rem-04b-browser-six.mjs
      - name: Preserve browser screenshots and server diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: luemi-stage03g-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-artifacts/rem-00c/**/*.png
            qa-artifacts/rem-01a/**/*.png
            qa-artifacts/rem-01b/**/*.png
            qa-artifacts/rem-01c/**/*.png
            qa-artifacts/rem-01e/**/*.png
            qa-artifacts/rem-04b/six/**
            /tmp/luemi-vite-qa.log
          if-no-files-found: error
