name: LUEMI REM-05B disposable lock resolver
on:
  push:
    branches:
      - remediation/rem-05b-telegram-identity-sessions-20261023
permissions:
  contents: read
jobs:
  dependency-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: |
          set -euo pipefail
          npm install -g npm@10.9.2 --no-audit --no-fund
          cp package-lock.json /tmp/luemi-lock-before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund -w @luemi/api pg@8.16.3 @types/pg@8.15.5
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const before=JSON.parse(readFileSync('/tmp/luemi-lock-before.json','utf8'));
          const after=JSON.parse(readFileSync('package-lock.json','utf8'));
          const changed={};
          for(const [name,entry] of Object.entries(after.packages)){
            if(JSON.stringify(before.packages[name])!==JSON.stringify(entry)) changed[name]=entry;
          }
          const removed=Object.keys(before.packages).filter(name=>!(name in after.packages));
          console.log('LOCK_PATCH_START'+Buffer.from(JSON.stringify({changed,removed})).toString('base64')+'LOCK_PATCH_END');
          NODE
