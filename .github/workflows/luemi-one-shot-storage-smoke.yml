name: LUEMI single authorized private Storage probe
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter VERIFY_LUEMI_PRIVATE_STORAGE_ONCE (exactly one synthetic PNG, no real users)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: luemi-one-time-private-storage-probe
  cancel-in-progress: false
jobs:
  synthetic-storage:
    # First two runs failed before upload; permit ONLY the owner's explicit new third attempt. All later runs are refused.
    if: github.repository == 'zhirayr2505/luemi' && github.ref == 'refs/heads/main' && github.actor == 'zhirayr2505' && github.run_number == 3 && github.run_attempt == 1 && inputs.confirmation == 'VERIFY_LUEMI_PRIVATE_STORAGE_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: beta-bootstrap
    env:
      BETA_RENDER_API_KEY: ${{ secrets.BETA_RENDER_API_KEY }}
      OWNER_PROBE_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies without package scripts
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Compile existing synthetic probe (no live writes)
        run: |
          npm run build -w @luemi/contracts
          npm run build -w @luemi/api
      - name: One authorized synthetic PUT / public deny / private GET / DELETE
        run: node scripts/one-shot-private-storage-smoke.mjs
