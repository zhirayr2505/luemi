name: LUEMI v6 polish mobile QA (isolated)
on:
  push:
    branches: [qa/profile-v6-polish-release-20261019]
permissions:
  contents: read
jobs:
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify profile v6 on mobile Chromium
        run: node qa/profile-v6-release.mjs
      - name: Upload v6 screenshots and result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luemi-v6-polish-qa
          path: qa-shots/
          if-no-files-found: ignore
