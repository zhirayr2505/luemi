name: LUEMI clean foundation CI
on:
  push:
    branches:
      - 'rebuild/**'
      - 'staging/**'
      - 'feat/stage02-*'
      - 'feat/stage02d-*'
      - 'feat/stage02e-*'
      - 'feat/stage02f-*'
      - 'feat/stage02g-*'
      - 'feat/stage03-*'
      - 'feat/stage03d-*'
      - 'feat/stage03d1-*'
      - 'feat/stage03e-*'
      - 'feat/stage03f-*'
      - 'feat/stage03f2-*'
      - 'fix/stage03-*'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
