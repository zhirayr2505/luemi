name: LUEMI one-time format Work profile candidate
on:
  push:
    branches: [feat/profile-complete-2026-10-19]
permissions:
  contents: write
jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run format
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/Profile.tsx apps/web/src/ProfileMotion.tsx apps/web/src/main.tsx apps/web/src/profilePage.css apps/web/src/profileTabs.css tests/profileTabs.test.ts tests/profileEntry.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(profile): Prettier format Work candidate and entry tests'
            git push origin HEAD:feat/profile-complete-2026-10-19
          fi
