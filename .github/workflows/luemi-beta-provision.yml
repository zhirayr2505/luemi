name: LUEMI public signup DB credential bootstrap (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROVISION_SCOPED_DB to confirm credential setup (NO feature activation)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: luemi-public-bootstrap
  cancel-in-progress: false
jobs:
  provision:
    if: github.repository == 'zhirayr2505/luemi' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PROVISION_SCOPED_DB'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Secrets are stored only in the protected GitHub Environment.
    # Require an environment reviewer in repository Settings.
    environment: beta-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned app database client
        run: npm ci --ignore-scripts --include=dev
      - name: Check closed-scope role bootstrap input handling (no credentials)
        run: node --test scripts/closed-beta-bootstrap.test.mjs
      - name: Provision separate SQL credentials; verify RLS principals; leave application flags OFF
        env:
          BETA_SUPABASE_OWNER_URL: ${{ secrets.BETA_SUPABASE_OWNER_URL }}
          BETA_RENDER_API_KEY: ${{ secrets.BETA_RENDER_API_KEY }}
          LUEMI_BOOTSTRAP_MODE: open
        run: node scripts/closed-beta-bootstrap.mjs
