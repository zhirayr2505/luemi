name: Temporary dependency lock refresh

on:
  push:
    branches:
      - maintenance/minimatch-log-controller-20261117

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify secure dependency graph
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const estree = pkg.packages['node_modules/@typescript-eslint/typescript-estree'];
          assert.equal(pkg.packages['node_modules/typescript-eslint'].version, '8.73.0');
          assert.equal(estree.version, '8.73.0');
          assert.equal(estree.dependencies.minimatch, '^11.0.1');
          const copies = Object.entries(pkg.packages)
            .filter(([path]) => path.endsWith('/node_modules/minimatch'));
          const vulnerable = copies.filter(([, entry]) => {
            const [major, minor, patch] = String(entry.version).split('.').map(Number);
            return major >= 7 && !(major > 11 || (major === 11 && (minor > 0 || (minor === 0 && patch >= 1))));
          });
          assert.deepEqual(vulnerable, []);
          assert.ok(copies.some(([, entry]) => {
            const [major, minor, patch] = String(entry.version).split('.').map(Number);
            return major > 11 || (major === 11 && (minor > 0 || (minor === 0 && patch >= 1)));
          }));
          console.log('typescript-eslint 8.73.0 and patched minimatch lock graph verified');
          NODE
      - name: Remove helper and commit generated lock
        run: |
          git rm .github/workflows/temporary-lock-refresh.yml
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No package-lock changes were generated."
            exit 1
          fi
          git commit -m "chore(deps): refresh TypeScript ESLint lock graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
