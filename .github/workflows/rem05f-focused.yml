name: LUEMI REM-05F Bliki deferred gate and mock-only QA
on:
  push:
    branches: [remediation/rem-05f-bliki-readiness-20261024]
  pull_request:
    branches: [remediation/rem-05e-webhook-secret-rotation-20261024]
permissions:
  contents: read
jobs:
  rem05f-security-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_BOOTSTRAP_ONLY: '1'
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_WEBHOOK_SECRET: ''
      HEALTH_CHECK_KEY: ''
      VITE_LUEMI_AUTH_V2: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reproducible mock tests (RED required before correction)
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build -w @luemi/contracts
          npm run typecheck -w @luemi/web
          npx --no-install tsx --test apps/api/test/rem05f-activation.test.ts apps/api/secure-tests/rem05f.test.ts
      - name: Public diff secret gate
        run: node scripts/rem-05b-public-diff-scan.mjs
