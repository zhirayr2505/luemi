name: REM-00B temporary lockfile provenance
on:
  push:
    branches:
      - 'remediation/rem-00b-dependency-gates-20261022'
    paths:
      - package.json
permissions:
  contents: read
jobs:
  generate-lock:
    if: github.repository == 'zhirayr2505/luemi'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Use pinned npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Create root workspace lock without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install and manifest consistency
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all --omit=optional > /tmp/rem00b-graph.txt
      - name: Emit deterministic lockfile for audited GitHub commit
        run: |
          node --input-type=module -e 'import fs from "node:fs";console.log("LUEMI_REM00B_LOCKFILE_JSON="+JSON.stringify(fs.readFileSync("package-lock.json","utf8")))'
