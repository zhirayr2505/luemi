name: Registration V4 visual QA
on:
  pull_request:
    paths:
      - 'apps/web/src/registration/**'
      - 'apps/web/src/App.tsx'
      - 'scripts/registration-v4-browser.mjs'
      - '.github/workflows/registration-v4-visual.yml'
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render all eight screens
        run: |
          npm run dev -w @luemi/web -- --host 127.0.0.1 --port 4173 > /tmp/luemi-v4-vite.log 2>&1 &
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:4173/registration-v4-qa.html > /dev/null && break; sleep 1; done
          node scripts/registration-v4-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-v4-eight-screens
          path: docs/registration-v4/screenshots/*.png
          if-no-files-found: warn
