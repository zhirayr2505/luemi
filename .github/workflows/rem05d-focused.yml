name: LUEMI REM-05D isolated private media and RLS QA
on:
  push:
    branches: [remediation/rem-05d-private-media-rls-moderation-20261023, remediation/rem-05e-webhook-secret-rotation-20261024]
  pull_request:
    branches: [remediation/rem-05c-geo-rate-cache-telegramweb-20261023, remediation/rem-05e-webhook-secret-rotation-20261024]
permissions:
  contents: read
jobs:
  rem05d-postgres-http-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_rem05d_admin_only
          POSTGRES_DB: rem05d_disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rem05d_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: rem05d_disposable
      PGPASSWORD: synthetic_rem05d_admin_only
      REM05D_ADMIN_DATABASE_URL: postgres://postgres:synthetic_rem05d_admin_only@127.0.0.1:5432/rem05d_disposable
      REM05D_ISSUER_DATABASE_URL: postgres://rem05d_ci_issuer:synthetic_rem05d_issuer@127.0.0.1:5432/rem05d_disposable
      REM05D_REQUEST_DATABASE_URL: postgres://rem05d_ci_request:synthetic_rem05d_request@127.0.0.1:5432/rem05d_disposable
      REM05D_WORKER_DATABASE_URL: postgres://rem05d_ci_worker:synthetic_rem05d_worker@127.0.0.1:5432/rem05d_disposable
      REM05D_MODERATOR_DATABASE_URL: postgres://rem05d_ci_moderator:synthetic_rem05d_moderator@127.0.0.1:5432/rem05d_disposable
      REM05D_COMBINED_DATABASE_URL: postgres://rem05d_ci_combined:synthetic_rem05d_combined@127.0.0.1:5432/rem05d_disposable
      REM05D_EXTRA_COLUMN_DATABASE_URL: postgres://rem05d_ci_extracol:synthetic_rem05d_extracol@127.0.0.1:5432/rem05d_disposable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reproducible compile and public diff secret gate
        run: |
          set -euo pipefail
          npm install -g npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build -w @luemi/contracts
          npm run typecheck -w @luemi/api
          node scripts/rem-05b-public-diff-scan.mjs
      - name: Disposable PostgreSQL 16 real-role migration and privacy suite
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL
          psql -v ON_ERROR_STOP=1 -f infra/migrations/0002_rem05b_identity_sessions.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/0003_rem05c_geo_budget.sql
          psql -v ON_ERROR_STOP=1 -f infra/migrations/0004_rem05d_private_media_moderation.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rem05d_ci_issuer LOGIN PASSWORD 'synthetic_rem05d_issuer' IN ROLE luemi_auth_issuer;
          CREATE ROLE rem05d_ci_request LOGIN PASSWORD 'synthetic_rem05d_request' IN ROLE luemi_request;
          CREATE ROLE rem05d_ci_worker LOGIN PASSWORD 'synthetic_rem05d_worker' IN ROLE luemi_media_worker;
          CREATE ROLE rem05d_ci_moderator LOGIN PASSWORD 'synthetic_rem05d_moderator' IN ROLE luemi_moderator;
          CREATE ROLE rem05d_ci_combined LOGIN NOINHERIT PASSWORD 'synthetic_rem05d_combined';
          GRANT luemi_request,luemi_media_worker TO rem05d_ci_combined;
          CREATE ROLE rem05d_ci_extracol LOGIN PASSWORD 'synthetic_rem05d_extracol' IN ROLE luemi_request;
          GRANT SELECT(decision) ON luemi_private.moderation_decisions TO rem05d_ci_extracol;
          SQL
          npx --no-install tsx --test apps/api/secure-tests/rem05d.test.ts
  rem05d-preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      STAGING_BOOTSTRAP_ONLY: '1'
      VITE_LUEMI_AUTH_V2: '0'
      REM05D_PRIVATE_ENABLED: '0'
      REM05D_PUBLICATION_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Existing local-only registration and client build
        run: |
          set -euo pipefail
          npm install -g npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npx --no-install playwright install chromium
      - name: 8-step local storage, profile gesture and media preservation
        run: |
          set -euo pipefail
          npm run dev -w @luemi/web -- --host 127.0.0.1 --port 5173 >/tmp/rem05d-local-fixture.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/profile-qa.html >/dev/null; then break; fi
            if [[ "$i" -eq 45 ]]; then tail -80 /tmp/rem05d-local-fixture.log >&2; exit 1; fi
            sleep 1
          done
          node scripts/rem-00c-browser-behavior.mjs
          node scripts/rem-02d-browser-lifecycle.mjs
          node scripts/rem-03a-browser-media.mjs
          node scripts/rem-03b-browser-track.mjs
          node scripts/rem-01d-browser-regression.mjs
          node scripts/rem-03c-browser-pinch.mjs
          node scripts/rem-03d-browser-morph.mjs
          node scripts/rem-04b-browser-six.mjs
          node scripts/rem-04d-browser-qa.mjs
