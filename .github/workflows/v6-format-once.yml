name: LUEMI v6 one-time Prettier
on:
  push:
    branches: [release/profile-v6-polish-20261019]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run format
      - run: npm run format:check
      - name: Save formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/ProfileTabs.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(profile): Prettier format interest icons'
            git push origin HEAD:release/profile-v6-polish-20261019
          fi
