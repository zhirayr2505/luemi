name: LUEMI profile-v5 release QA (isolated)
on:
  push:
    branches: [qa/profile-v5-release-20261019]
permissions:
  contents: read
jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run detailed mobile Chromium release tests
        run: node qa/profile-v5-release.mjs
      - name: Upload screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luemi-profile-v5-qa-shots
          path: qa-shots/
          if-no-files-found: ignore
