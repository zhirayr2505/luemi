name: LUEMI REM-04B baseline Chromium measurements
on:
  push:
    branches:
      - remediation/rem-04b-hero-blur-underlay-20261022
  pull_request:
    branches:
      - remediation/rem-04a-react-startup-20261022
jobs:
  read-only-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build contracts
        run: npm run build -w @luemi/contracts
      - name: Read-only visual baseline on accepted REM-04A application code
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -w @luemi/web -- --host 127.0.0.1 --port 5173 >/tmp/luemi-rem04b-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/profile-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/profile-qa.html >/dev/null
          node scripts/rem-04b-browser-baseline.mjs
      - name: Archive screenshots, DOM measurements and Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-04b-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-artifacts/rem-04b/baseline/**
            /tmp/luemi-rem04b-vite.log
          if-no-files-found: warn
