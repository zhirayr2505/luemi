# Independent LUEMI service, no VEYRA / blotX resources.
services:
  - type: web
    name: luemi
    runtime: node
    repo: https://github.com/zhirayr2505/luemi
    branch: main
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
