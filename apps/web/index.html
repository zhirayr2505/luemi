<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1E0F38" />
    <link rel="preload" as="image" href="/assets/registration/welcome-cinematic.webp" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.pixabay.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>LUEMI · Telegram Mini App</title>
    <style>
      html,body{min-height:100%;margin:0;background:#160A2B;color:#fff}
      /* Persistent first-paint poster, identical to the original hero photograph. */
      #luemi-boot{position:fixed;inset:0;z-index:2147483647;overflow:hidden;background:#160A2B;
        color:#fff;font-family:system-ui,-apple-system,sans-serif}
      #luemi-boot::before{content:"";position:absolute;inset:0;
        background:url('/assets/registration/welcome-cinematic.webp') center 38%/cover no-repeat}
      #luemi-boot::after{content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(180deg,rgba(19,21,26,.45),transparent 26%,
          transparent 46%,rgba(17,20,24,.33) 64%,rgba(15,17,21,.96) 100%)}
      #luemi-boot-mark{position:absolute;z-index:2;left:20px;
        top:max(calc(env(safe-area-inset-top,0px) + 18px),84px);height:43px}
      #luemi-boot-mark img{width:130px;height:43px;object-fit:contain;object-position:left center;
        filter:grayscale(1) brightness(0) invert(1) drop-shadow(0 3px 16px rgba(20,23,29,.28))}
      #luemi-boot-copy{position:absolute;z-index:2;left:24px;right:24px;bottom:calc(128px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;text-shadow:0 3px 22px rgba(10,12,18,.65)}
      #luemi-boot-copy h1{margin:0;font-size:clamp(25px,6vw,34px);line-height:1.1;font-weight:750;letter-spacing:-.035em;color:#fff}
      #luemi-boot-copy p{margin:12px auto 0;max-width:320px;font-size:13px;line-height:1.5;font-weight:450;color:rgba(255,255,255,.9)}
      #luemi-boot[data-state="error"] #luemi-boot-copy{display:none}
      @media(max-height:650px){#luemi-boot-copy{bottom:calc(108px + env(safe-area-inset-bottom,0px))}#luemi-boot-copy h1{font-size:24px}#luemi-boot-copy p{margin-top:7px;font-size:12px}}
      #luemi-boot-spinner{position:absolute;z-index:2;left:calc(50% - 18px);
        bottom:calc(48px + env(safe-area-inset-bottom,0px));width:36px;height:36px;
        box-sizing:border-box;border:2.5px solid rgba(255,255,255,.23);
        border-top-color:rgba(255,255,255,.96);border-radius:50%;
        animation:luemi-boot-spin .8s linear infinite}
      @keyframes luemi-boot-spin{to{transform:rotate(360deg)}}
      #luemi-boot-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
        overflow:hidden;clip-path:inset(50%);white-space:nowrap}
      #luemi-boot[data-state="error"] #luemi-boot-spinner{display:none}
      #luemi-boot[data-state="error"] #luemi-boot-status{position:absolute;z-index:2;
        left:26px;right:26px;bottom:calc(117px + env(safe-area-inset-bottom,0px));
        width:auto;height:auto;margin:0;clip-path:none;white-space:normal;
        font-size:14px;line-height:1.5;text-align:center;color:#fff}
      #luemi-boot-retry[hidden]{display:none}
      #luemi-boot-retry{position:absolute;z-index:2;bottom:calc(38px + env(safe-area-inset-bottom,0px));
        left:26px;right:26px;min-height:54px;font:inherit;font-size:15px;font-weight:650;
        border:1px solid rgba(255,255,255,.7);border-radius:999px;
        background:#6E3EFF;color:#FFFFFF}
      @media(prefers-reduced-motion:reduce){#luemi-boot-spinner{animation-duration:1.8s}}
    </style>
    <script defer src="/telegram-web-app.js"></script>
    <script defer src="/telegram-early-fullscreen.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="luemi-boot" role="status" aria-live="polite">
      <div id="luemi-boot-mark"><img src="/assets/brand/wordmark_original_raster_alpha_W06.webp" alt="LUEMI" /></div>
      <div id="luemi-boot-copy"><h1>Больше, чем знакомства</h1><p>Реальные люди. Настоящие эмоции.<br/>Ближе, чем кажется.</p></div>
      <span id="luemi-boot-spinner" aria-hidden="true"></span>
      <p id="luemi-boot-status">Загружаем приложение…</p>
      <button id="luemi-boot-retry" type="button" hidden>Повторить открытие</button>
    </div>
    <script src="/boot-recovery.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
